name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, migrate local D1, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Worker types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Apply committed migrations to local D1
        run: npm run db:migrate:local

      - name: Test
        run: npm test
